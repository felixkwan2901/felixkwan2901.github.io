      <text x="204" y="84" text-anchor="end" font-size="11" fill="#a3a3a0">75%</text>
    </g>
    <g transform="translate(16,214)">
      <rect width="218" height="92" rx="4" fill="#1f1f1f"/>
      <text x="14" y="26" font-size="13" font-weight="600" fill="#f2f2f0">Job 1031 · Demo Office</text>
      <text x="14" y="46" font-size="11" fill="#85857f">Switchboard install</text>
      <rect x="14" y="62" width="190" height="6" rx="3" fill="#333"/>
