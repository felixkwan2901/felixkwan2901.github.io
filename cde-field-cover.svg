<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="CDE Field — on-site task progress app for electricians (sample data)" font-family="Inter,'Segoe UI',Arial,sans-serif">
  <rect width="800" height="500" fill="#0d0d0d"/>
  <g stroke="#ffffff" stroke-opacity="0.04"><path d="M0 100H800M0 200H800M0 300H800M0 400H800"/><path d="M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500"/></g>

  <!-- left copy -->
  <text x="60" y="92" font-size="12" letter-spacing="3" font-weight="600" fill="#6b6b68">FIELD SERVICE APP · PWA</text>
