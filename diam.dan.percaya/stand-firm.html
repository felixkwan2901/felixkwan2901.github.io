<style>
/* Layout: a thin HUD strip above a board + sidebar pair. A committed single look:
   night ground, gold light for the defenders, crimson and violet for what comes up the road. */
:root{
  --bg:#0e1220; --bg-2:#161b2e; --panel:#1a2036; --panel-2:#222a48; --line:#2f3756;
  --fg:#efe6d2; --fg-dim:#a39b86;
  --gold:#e2b84f; --gold-2:#f6dc8c; --gold-dim:#8a6f2c;
  --evil:#b43a5a; --holy:#8fd3ff; --good:#7cc98f;
  --font-display:'Cinzel',Georgia,'Times New Roman',serif;
  --font-body:'Crimson Pro',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:14px 28px;min-height:100%}
.app{max-width:1180px;margin:0 auto;display:grid;gap:16px}

.hud{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:1.9rem;letter-spacing:.06em;margin:0;color:var(--gold-2);line-height:1}
.brand .tag{display:block;color:var(--fg-dim);font-style:italic;margin-top:5px}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat{display:grid;gap:3px;min-width:64px}
.stat .lbl{font-family:var(--font-display);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-dim)}
.stat .val{font-family:var(--font-display);font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.stat .val.gold{color:var(--gold-2)}
.stat .val.hope{color:#f3b3bb}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.board{position:relative;min-width:0}
canvas#game{display:block;width:100%;max-width:100%;aspect-ratio:14/10;border:1px solid var(--line);border-radius:6px;background:var(--bg-2);touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,10,20,.8);border-radius:6px;padding:16px;overflow:auto}
.ov-card{max-width:460px;text-align:center;display:grid;gap:14px;justify-items:center}
.ov-eyebrow{font-family:var(--font-display);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0}
.ov-card h2{font-family:var(--font-display);font-size:2.1rem;margin:0;color:var(--gold-2);letter-spacing:.04em;text-wrap:balance;line-height:1.1}
.ov-verse{font-style:italic;font-size:1.08rem;margin:0;text-wrap:balance}
.ov-verse span{display:block;font-style:normal;font-family:var(--font-display);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-dim);margin-top:6px}
.ov-how{text-align:left;margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:1rem}
.ov-how b{color:var(--gold-2);font-weight:600}
.ov-stats{margin:0;font-family:var(--font-display);font-size:.8rem;letter-spacing:.08em;color:var(--fg)}
.ov-best{color:var(--fg-dim);margin:0;font-size:.95rem}
.ov-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (max-width:520px){.ov-card h2{font-size:1.6rem}.ov-how{font-size:.92rem}.overlay{padding:10px}.ov-card{gap:10px}}

.side{display:grid;gap:14px;min-width:0}
.verse{border-left:2px solid var(--gold-dim);padding:4px 0 4px 12px;font-style:italic;margin:0;min-height:3.2em}
.verse cite{display:block;font-style:normal;font-family:var(--font-display);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-dim);margin-top:4px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.controls .primary{flex:1 1 100%}
.controls button:not(.primary){flex:1 1 auto}
.remain{color:var(--fg-dim);font-size:.95rem;margin:0;min-height:1.4em}

button{font-family:var(--font-display);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer;transition:background .15s,border-color .15s}

button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
button:disabled:hover{background:var(--panel);border-color:var(--line)}
button.primary{background:var(--gold);color:#1a1405;border-color:var(--gold-2);font-weight:700}
button.primary:hover{background:var(--gold-2)}
button.primary:disabled:hover{background:var(--gold)}
button.big{padding:14px 26px;font-size:.92rem}

.towers{display:grid;gap:8px}

.tower-btn{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:1rem;padding:8px 10px;border-radius:6px}
.tower-btn canvas{width:44px;height:44px;display:block}
.tb-body{min-width:0}
.tb-name{font-family:var(--font-display);font-size:.78rem;letter-spacing:.04em;display:block;color:var(--gold-2)}
.tb-desc{display:block;color:var(--fg-dim);font-size:.9rem;line-height:1.3}
.tb-cost{font-family:var(--font-display);font-size:.9rem;color:var(--gold-2);font-variant-numeric:tabular-nums;display:grid;justify-items:end;gap:4px}
.tb-key{font-size:.62rem;color:var(--fg-dim);letter-spacing:.1em;border:1px solid var(--line);border-radius:3px;padding:1px 5px}
.tower-btn.active{border-color:var(--gold);background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--gold)}
.tower-btn.poor{opacity:.55}
.tower-btn.poor .tb-cost{color:var(--evil)}

.selected{border:1px solid var(--gold-dim);border-radius:6px;padding:12px;display:grid;gap:8px;background:var(--panel)}
.selected h3{margin:0;font-family:var(--font-display);font-size:.95rem;color:var(--gold-2);letter-spacing:.04em}
.selected p{margin:0;color:var(--fg-dim);font-size:.95rem}
.sel-row{display:flex;gap:8px;flex-wrap:wrap}
.sel-row button{flex:1 1 auto}
.help{color:var(--fg-dim);font-size:.9rem;margin:0}
.help kbd{font-family:var(--font-display);font-size:.68rem;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--fg)}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(14,18,32,.94);border:1px solid var(--gold-dim);color:var(--gold-2);font-family:var(--font-display);font-size:.72rem;letter-spacing:.08em;padding:8px 14px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);text-overflow:ellipsis;overflow:hidden}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">

          <button id="btnClose">Close</button>
        </div>
      </div>
      <p class="help">Keys: <kbd>1</kbd>–<kbd>5</kbd> choose a defender, <kbd>Esc</kbd> cancel, <kbd>Space</kbd> begin wave, <kbd>U</kbd> upgrade, <kbd>S</kbd> sell, <kbd>F</kbd> speed, <kbd>P</kbd> pause.</p>
    </aside>
  </div>
</div>

/* ---------- game logic ---------- */
function spawn(type){var b=ENEMY[type],m=hpMult(G.wave);G.enemies.push({type:type,hp:b.hp*m,max:b.hp*m,d:0,spd:b.spd*CELL,slow:1,r:b.r,armor:b.armor,reward:b.reward,dmg:b.dmg,x:PATH[0].x,y:PATH[0].y,dx:1,dy:0,face:1,wob:Math.random()*TAU,flash:0,dead:false});if(b.boss){sound('boss');G.texts.push({x:W/2,y:H/2-30,s:'Legion approaches',ttl:2,big:true});}}
function burst(x,y,n){for(var i=0;i<n;i++){var a=Math.random()*TAU,s=40+Math.random()*90;G.fx.push({k:'p',x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,ttl:0.5+Math.random()*0.3,max:0.8,col:Math.random()<0.5?'#f6dc8c':'#ffffff'});}}
function hit(e,dmg,pierce){if(e.dead)return;var d=Math.max(1,dmg-(pierce?0:e.armor));e.hp-=d;e.flash=0.08;if(e.hp<=0){e.dead=true;G.grace+=e.reward;G.score+=e.reward;G.kills++;burst(e.x,e.y,ENEMY[e.type].boss?36:8);G.texts.push({x:e.x,y:e.y-12,s:'+'+e.reward,ttl:0.8});sound('kill');}}
function pickTarget(t,range){var best=null,bd=-1;for(var i=0;i<G.enemies.length;i++){var e=G.enemies[i];if(e.dead)continue;if(dist(t,e)<=range&&e.d>bd){bd=e.d;best=e;}}return best;}
function fire(t,b,s,tgt){
  if(b.kind==='orb'){G.projs.push({x:t.x,y:t.y,tgt:tgt,spd:8*CELL,dmg:s.dmg,col:'#f6dc8c',kind:'orb'});}
  else if(b.kind==='beam'){hit(tgt,s.dmg,true);G.fx.push({k:'beam',x1:t.x,y1:t.y,x2:tgt.x,y2:tgt.y,ttl:0.12,max:0.12,col:'#ffffff'});}
  else if(b.kind==='splash'){G.projs.push({x:t.x,y:t.y,tgt:tgt,spd:6*CELL,dmg:s.dmg,splash:s.splash,col:'#ffb347',kind:'splash',ax:tgt.x,ay:tgt.y});}
  else if(b.kind==='chain'){
    var prev=tgt,dmg=s.dmg,hitSet=[tgt];hit(tgt,dmg,false);
    G.fx.push({k:'beam',x1:t.x,y1:t.y,x2:tgt.x,y2:tgt.y,ttl:0.15,max:0.15,col:'#bfe8ff'});
    for(var i=0;i<b.chain;i++){var best=null,bd=1.6*CELL;for(var j=0;j<G.enemies.length;j++){var e=G.enemies[j];if(e.dead||hitSet.indexOf(e)>=0)continue;var dd=dist(prev,e);if(dd<bd){bd=dd;best=e;}}if(!best)break;dmg*=0.65;hit(best,dmg,false);G.fx.push({k:'beam',x1:prev.x,y1:prev.y,x2:best.x,y2:best.y,ttl:0.15,max:0.15,col:'#bfe8ff'});hitSet.push(best);prev=best;}
  }
}
function startWave(){
  if(G.state!=='build'||G.over||!started)return;
  G.wave++;G.state='wave';G.spawnQ=[];var t=0;
  waveDef(G.wave).forEach(function(grp){for(var i=0;i<grp.n;i++){G.spawnQ.push({t:t,type:grp.t});t+=grp.g;}t+=1.2;});
  G.spawnT=0;setVerse(VERSES[(G.wave-1)%VERSES.length]);sound('wave');setBuild(null);updateHUD();
}
function waveClear(){
  G.state='build';var bonus=40+G.wave*8;G.grace+=bonus;G.score+=G.wave*25;
  G.texts.push({x:W/2,y:H/2,s:'Wave '+G.wave+' held   +'+bonus+' grace',ttl:2,big:true});
  saveBest(G.wave);if(G.wave===20&&!G.won){G.won=true;sound('win');showOverlay('win');}updateHUD();
}
function gameOver(){G.over=true;G.state='over';saveBest(G.wave-1);sound('over');setBuild(null);select(null);showOverlay('over');updateHUD();}
function step(dt){
  G.time+=dt;
  if(G.state==='wave'){G.spawnT+=dt;while(G.spawnQ.length&&G.spawnQ[0].t<=G.spawnT){spawn(G.spawnQ.shift().type);}}
  var i,j,e,t;
  for(i=0;i<G.enemies.length;i++)G.enemies[i].slow=1;
  for(i=0;i<G.towers.length;i++){t=G.towers[i];if(TOWER[t.type].kind!=='aura')continue;var sa=tstat(t);for(j=0;j<G.enemies.length;j++){e=G.enemies[j];if(dist(t,e)<=sa.range+e.r)e.slow=Math.min(e.slow,sa.slow);}}
  for(i=0;i<G.enemies.length;i++){e=G.enemies[i];if(e.dead)continue;e.flash=Math.max(0,e.flash-dt);e.d+=e.spd*e.slow*dt;
    if(e.d>=TOTAL){e.dead=true;G.hope-=e.dmg;G.fx.push({k:'hurt',ttl:0.5,max:0.5});sound('hurt');continue;}
    var p=posAt(e.d);e.x=p.x;e.y=p.y;e.dx=p.dx;e.dy=p.dy;if(p.dx>0.5)e.face=1;else if(p.dx<-0.5)e.face=-1;}
  for(i=0;i<G.towers.length;i++){t=G.towers[i];var b=TOWER[t.type];if(b.kind==='aura')continue;t.cd-=dt;if(t.cd>0)continue;var s=tstat(t);var tgt=pickTarget(t,s.range);if(!tgt)continue;t.cd=1/s.rate;t.aim=Math.atan2(tgt.y-t.y,tgt.x-t.x);fire(t,b,s,tgt);}
  for(i=0;i<G.projs.length;i++){var pr=G.projs[i];
    if(pr.kind==='orb'){if(pr.tgt.dead){pr.dead=true;continue;}var ddx=pr.tgt.x-pr.x,ddy=pr.tgt.y-pr.y,ll=Math.hypot(ddx,ddy),mv=pr.spd*dt;if(ll<=mv+pr.tgt.r){hit(pr.tgt,pr.dmg,false);pr.dead=true;}else{pr.x+=ddx/ll*mv;pr.y+=ddy/ll*mv;}}
    else{if(!pr.tgt.dead){pr.ax=pr.tgt.x;pr.ay=pr.tgt.y;}var sdx=pr.ax-pr.x,sdy=pr.ay-pr.y,sl=Math.hypot(sdx,sdy),smv=pr.spd*dt;
      if(sl<=smv){pr.dead=true;for(j=0;j<G.enemies.length;j++){e=G.enemies[j];if(!e.dead&&Math.hypot(pr.ax-e.x,pr.ay-e.y)<=pr.splash+e.r)hit(e,pr.dmg,false);}G.fx.push({k:'ring',x:pr.ax,y:pr.ay,r:pr.splash,ttl:0.35,max:0.35,col:'#ffb347'});sound('boom');}
      else{pr.x+=sdx/sl*smv;pr.y+=sdy/sl*smv;}}}
  G.projs=G.projs.filter(function(p){return !p.dead;});
  G.enemies=G.enemies.filter(function(e){return !e.dead;});
  for(i=0;i<G.fx.length;i++){var f=G.fx[i];f.ttl-=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=0.92;f.vy*=0.92;}}
  G.fx=G.fx.filter(function(f){return f.ttl>0;});
  for(i=0;i<G.texts.length;i++){G.texts[i].ttl-=dt;G.texts[i].y-=(G.texts[i].big?6:22)*dt;}
  G.texts=G.texts.filter(function(x){return x.ttl>0;});
  if(G.hope<=0&&!G.over){gameOver();return;}
  if(G.state==='wave'&&!G.spawnQ.length&&!G.enemies.length)waveClear();
}

/* ---------- UI ---------- */
var tbtns={};
function buildTowerButtons(){
  var wrap=$('towers');
  TORDER.forEach(function(type){var b=TOWER[type];
    var btn=document.createElement('button');btn.className='tower-btn';btn.id='tb-'+type;btn.type='button';
    var cv=document.createElement('canvas');cv.width=88;cv.height=88;var g=cv.getContext('2d');g.setTransform(2,0,0,2,44,50);g.scale(0.75,0.75);drawTowerIcon(g,type,1,-Math.PI/2,0);
    var body=document.createElement('span');body.className='tb-body';
    var nm=document.createElement('span');nm.className='tb-name';nm.textContent=b.name;
    var ds=document.createElement('span');ds.className='tb-desc';ds.textContent=b.desc;
    body.appendChild(nm);body.appendChild(ds);
    var cost=document.createElement('span');cost.className='tb-cost';var cv2=document.createElement('span');cv2.textContent='✦ '+b.cost;var key=document.createElement('span');key.className='tb-key';key.textContent=b.key;cost.appendChild(cv2);cost.appendChild(key);
    btn.appendChild(cv);btn.appendChild(body);btn.appendChild(cost);
    btn.addEventListener('click',function(){setBuild(G.buildType===type?null:type);});
    wrap.appendChild(btn);tbtns[type]=btn;});
}
function setBuild(type){if(!started||G.over){type=null;}if(type&&G.grace<TOWER[type].cost){toast('Not enough grace for the '+TOWER[type].name+'.');return;}G.buildType=type;if(type)select(null);updateHUD();}
function towerAt(c,r){for(var i=0;i<G.towers.length;i++){if(G.towers[i].col===c&&G.towers[i].row===r)return G.towers[i];}return null;}
function select(t){G.sel=t;if(t)G.buildType=null;renderSel();updateHUD();}
function onCell(c,r){
  if(G.over||!started||G.paused)return;
  if(c<0||r<0||c>=COLS||r>=ROWS)return;
  var existing=towerAt(c,r);
  if(G.buildType){
    if(existing){select(existing);return;}
    if(blocked.has(c+','+r)){toast('That ground belongs to the road.');return;}
    var b=TOWER[G.buildType];
    if(G.grace<b.cost){toast('Not enough grace.');return;}
    G.grace-=b.cost;G.towers.push({type:G.buildType,col:c,row:r,x:(c+.5)*CELL,y:(r+.5)*CELL,level:1,cd:0,spent:b.cost,aim:-Math.PI/2});
    burst((c+.5)*CELL,(r+.5)*CELL,6);sound('place');
    if(G.grace<b.cost)G.buildType=null;
    updateHUD();
  }else{select(existing||null);}
}
function upgradeSel(){var t=G.sel;if(!t||t.level>=3||G.over)return;var uc=upgradeCost(t);if(G.grace<uc){toast('Not enough grace to upgrade.');return;}G.grace-=uc;t.spent+=uc;t.level++;burst(t.x,t.y,12);sound('upgrade');renderSel();updateHUD();}
function sellSel(){var t=G.sel;if(!t||G.over)return;G.grace+=sellValue(t);G.towers=G.towers.filter(function(x){return x!==t;});G.sel=null;sound('sell');renderSel();updateHUD();}
function renderSel(){
  var t=G.sel,p=$('selPanel');if(!t){p.hidden=true;return;}p.hidden=false;
  var b=TOWER[t.type],s=tstat(t);
  $('selName').textContent=b.name;$('selLevel').textContent='Level '+t.level+' of 3';
  var txt;
  if(b.kind==='aura')txt='Range '+(s.range/CELL).toFixed(1)+' tiles. Enemies move at '+Math.round(s.slow*100)+'% speed inside it.';
  else{txt='Range '+(s.range/CELL).toFixed(1)+' tiles. '+Math.round(s.dmg)+' damage, '+s.rate.toFixed(1)+' strikes a second.';
    if(b.pierce)txt+=' Ignores armour.';if(b.splash)txt+=' Splash '+(s.splash/CELL).toFixed(1)+' tiles.';if(b.chain)txt+=' Leaps to '+b.chain+' more.';}
  $('selStats').textContent=txt;

function updateHUD(){
  setText('grace',String(Math.floor(G.grace)));setText('hope',String(Math.max(0,G.hope)));
  setText('wave',G.wave>20?String(G.wave):G.wave+' / 20');setText('score',String(G.score));
  var btn=$('startWave');
  if(G.over){btn.disabled=true;setText('startWave','The chapel has fallen');}
  else if(!started){btn.disabled=true;setText('startWave','Begin wave 1');}
  else if(G.state==='build'){btn.disabled=false;var n=G.wave+1;setText('startWave',(n>20?'Send wave ':'Begin wave ')+n);}
  else{btn.disabled=true;setText('startWave','Wave '+G.wave+' underway');}
  var rem;
  if(G.over)rem='Held '+Math.max(0,G.wave-1)+' waves.';
  else if(G.state==='wave')rem=(G.enemies.length+G.spawnQ.length)+' enemies remain.';
  else if(G.wave===0)rem='Place your first defenders beside the road, then begin.';
  else rem='The road is quiet. Build and upgrade, then begin.';
  setText('remain',rem);
  TORDER.forEach(function(type){var b=tbtns[type];b.classList.toggle('poor',G.grace<TOWER[type].cost);b.classList.toggle('active',G.buildType===type);});
  if(G.sel){var ub=$('btnUpgrade');if(G.sel.level<3)ub.disabled=G.grace<upgradeCost(G.sel);}
  setText('speedBtn',G.speed+'×');setText('muteBtn',muted?'Sound off':'Sound on');setText('pauseBtn',G.paused?'Resume':'Pause');
}

      '<p class="ov-verse">“Put on the whole armour of God, that ye may be able to stand against the wiles of the devil.”<span>Ephesians 6:11</span></p>'+
      '<ul class="ov-how"><li>Evil pours out of the rift on the left and marches down the road toward the chapel.</li>'+
      '<li>Spend <b>Grace</b> to place defenders on open ground beside the road. Click a placed defender to upgrade or sell it.</li>'+
      '<li>Every enemy that reaches the chapel costs <b>Hope</b>. Lose it all and the light goes out. Hold twenty waves.</li></ul>'+
      '<button class="primary big" id="btnBegin" type="button">Take your stand</button><p class="ov-best">'+bestLine()+'</p></div>';
  }else if(kind==='over'){
    html='<div class="ov-card"><p class="ov-eyebrow">The chapel has fallen</p><h2>The light went out</h2>'+
      '<p class="ov-verse">“Weeping may endure for a night, but joy cometh in the morning.”<span>Psalm 30:5</span></p>'+
      '<p class="ov-stats">Held '+Math.max(0,G.wave-1)+' waves · Score '+G.score+' · '+G.kills+' enemies turned back</p>'+
      '<button class="primary big" id="btnRetry" type="button">Rise and try again</button><p class="ov-best">'+bestLine()+'</p></div>';
  }else if(kind==='win'){
    html='<div class="ov-card"><p class="ov-eyebrow">Twenty waves held</p><h2>You have kept the faith</h2>'+
      '<p class="ov-verse">“I have fought a good fight, I have finished my course, I have kept the faith.”<span>2 Timothy 4:7</span></p>'+
      '<p class="ov-stats">Score '+G.score+' · Hope remaining '+G.hope+'</p>'+
      '<div class="ov-actions"><button class="primary big" id="btnEndless" type="button">Keep standing</button><button class="big" id="btnAgain" type="button">Play again</button></div>'+
      '<p class="ov-best">Endless waves follow, each stronger than the last. '+bestLine()+'</p></div>';
  }else if(kind==='paused'){
    html='<div class="ov-card"><p class="ov-eyebrow">Be still</p><h2>Paused</h2><button class="primary big" id="btnResume" type="button">Resume</button></div>';
  }
  overlay.innerHTML=html;overlay.hidden=false;
}
overlay.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  ensureAudio();
  if(b.id==='btnBegin'){started=true;overlay.hidden=true;last=0;}
  else if(b.id==='btnRetry'||b.id==='btnAgain'){var sp=G.speed;newGame();G.speed=sp;started=true;overlay.hidden=true;last=0;setVerse(VERSES[3]);renderSel();}
  else if(b.id==='btnEndless'){overlay.hidden=true;last=0;}
  else if(b.id==='btnResume'){G.paused=false;overlay.hidden=true;last=0;}
  updateHUD();
});
function togglePause(){if(!started||G.over)return;G.paused=!G.paused;if(G.paused)showOverlay('paused');else{overlay.hidden=true;last=0;}updateHUD();}
$('startWave').addEventListener('click',function(){ensureAudio();startWave();});
$('speedBtn').addEventListener('click',function(){G.speed=G.speed===1?2:1;updateHUD();});
$('pauseBtn').addEventListener('click',togglePause);
$('muteBtn').addEventListener('click',function(){muted=!muted;if(!muted)ensureAudio();updateHUD();});
$('btnUpgrade').addEventListener('click',upgradeSel);
$('btnSell').addEventListener('click',sellSel);
$('btnClose').addEventListener('click',function(){select(null);});

function toCanvas(e){var r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
canvas.addEventListener('pointermove',function(e){var p=toCanvas(e);G.hover={c:Math.floor(p.x/CELL),r:Math.floor(p.y/CELL)};});
canvas.addEventListener('pointerleave',function(){G.hover=null;});
canvas.addEventListener('pointerdown',function(e){e.preventDefault();ensureAudio();var p=toCanvas(e);onCell(Math.floor(p.x/CELL),Math.floor(p.y/CELL));if(e.pointerType==='touch')G.hover=null;});
document.addEventListener('keydown',function(e){
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  var k=e.key;
  if(k>='1'&&k<='5'){setBuild(TORDER[Number(k)-1]);}
  else if(k==='Escape'){G.buildType=null;select(null);}
  else if(k===' '){e.preventDefault();ensureAudio();startWave();}
  else if(k==='u'||k==='U'){upgradeSel();}
  else if(k==='s'||k==='S'){sellSel();}
  else if(k==='f'||k==='F'){G.speed=G.speed===1?2:1;updateHUD();}
  else if(k==='p'||k==='P'){togglePause();}
});
document.addEventListener('visibilitychange',function(){if(document.hidden)last=0;});

function loop(ts){
  requestAnimationFrame(loop);
  if(!last){last=ts;return;}
  var dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(started&&!G.paused&&!G.over){for(var i=0;i<G.speed;i++){step(dt);if(G.over)break;}}
  draw();
  hudTimer+=dt;if(hudTimer>0.12){hudTimer=0;updateHUD();}
}

/* ---------- boot and hot reload ---------- */
function snapshot(){return {v:1,started:started,grace:G.grace,hope:G.hope,wave:G.state==='wave'?G.wave-1:G.wave,score:G.score,kills:G.kills,won:G.won,over:G.over,speed:G.speed,muted:muted,towers:G.towers.map(function(t){return {type:t.type,col:t.col,row:t.row,level:t.level,spent:t.spent};})};}
function start(data){
  newGame();buildTowerButtons();setVerse(VERSES[3]);
  if(data&&data.v===1&&data.started&&!data.over&&data.hope>0){
    started=true;G.grace=data.grace;G.hope=data.hope;G.wave=data.wave;G.score=data.score;G.kills=data.kills||0;G.won=!!data.won;G.speed=data.speed===2?2:1;muted=!!data.muted;
    (data.towers||[]).forEach(function(t){if(!TOWER[t.type])return;G.towers.push({type:t.type,col:t.col,row:t.row,x:(t.col+.5)*CELL,y:(t.row+.5)*CELL,level:Math.min(3,Math.max(1,t.level|0)),cd:0,spent:t.spent|0,aim:-Math.PI/2});});
    if(G.wave>0)setVerse(VERSES[(G.wave-1)%VERSES.length]);
    overlay.hidden=true;
  }else{showOverlay('intro');}
  updateHUD();requestAnimationFrame(loop);
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){window.claude.hot.snapshot(snapshot);}
if(window.claude&&window.claude.hot&&window.claude.hot.ready){window.claude.hot.ready(start);}else{start(window.claude&&window.claude.hot?window.claude.hot.data:null);}
})();
</script>

</body></html>
